<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Registration - HealthPredict</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @keyframes popIn {
            0% {
                opacity: 0;
                transform: translateY(20px);
                filter: blur(5px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        .logo-char {
            display: inline-block;
            opacity: 0;
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        body {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen p-4">

    <!-- Logo -->
    <div class="flex items-center justify-center mb-8 pt-6">
        <div class="text-5xl font-bold tracking-tight select-none flex items-center justify-center">
            <span class="logo-char" style="color: #003366; animation-delay: 0s">D</span>
            <span class="logo-char" style="color: #003366; animation-delay: 0.1s">r</span>
            <span class="w-3"></span>
            <span class="logo-char" style="color: #009999; animation-delay: 0.2s">S</span>
            <span class="logo-char" style="color: #009999; animation-delay: 0.3s">t</span>
            <span class="logo-char" style="color: #009999; animation-delay: 0.4s">r</span>
            <span class="logo-char" style="color: #009999; animation-delay: 0.5s">i</span>
            <span class="logo-char" style="color: #009999; animation-delay: 0.6s">p</span>
        </div>
    </div>

    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-blue-600 p-6 text-center">
            <h1 class="text-3xl font-bold text-white">Doctor Registration</h1>
            <p class="text-blue-100 mt-2">Join our network of healthcare professionals</p>
        </div>

        <form id="doctorForm" class="p-8">
            <div id="error-msg" class="hidden bg-red-100 text-red-700 p-3 rounded-lg mb-6 text-sm"></div>
            <div id="success-msg" class="hidden bg-green-100 text-green-700 p-3 rounded-lg mb-6 text-sm">
                Registration Successful!
            </div>

            <!-- 1. Personal Details -->
            <div class="mb-8">
                <h3 class="text-xl font-bold text-gray-800 border-b pb-2 mb-4 flex items-center">
                    <span
                        class="bg-blue-100 text-blue-600 rounded-full w-8 h-8 flex items-center justify-center mr-2 text-sm">1</span>
                    Personal Information
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Swapped: Name Left, Photo Right -->
                    <div class="space-y-4">
                        <div>
                            <label class="block text-gray-700 text-sm font-semibold mb-2">Full Name</label>
                            <input type="text" name="name" required
                                class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-gray-700 text-sm font-semibold mb-2">Email (Login ID)</label>
                            <input type="email" name="email" required
                                class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-gray-700 text-sm font-semibold mb-2">Personal Phone</label>
                            <input type="tel" name="personalPhone" required
                                class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-gray-700 text-sm font-semibold mb-2">Doctor Photo</label>
                        <div
                            class="flex flex-col items-center justify-center border-2 border-dashed border-gray-300 rounded-lg p-6 bg-gray-50 hover:bg-gray-100 transition">
                            <div id="photoPreview"
                                class="w-24 h-24 mb-3 rounded-full bg-gray-200 flex items-center justify-center overflow-hidden">
                                <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                </svg>
                            </div>
                            <input type="file" id="doctorPhoto" accept="image/*" class="text-sm text-gray-500"
                                onchange="previewImage(this, 'photoPreview')">
                        </div>
                    </div>

                    <div class="md:col-span-2">
                        <label class="block text-gray-700 text-sm font-semibold mb-2">Password</label>
                        <div class="relative">
                            <input type="password" id="password" name="password" required
                                class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none pr-10">
                            <button type="button" onclick="togglePasswordVisibility()" tabindex="-1"
                                class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-blue-600 focus:outline-none">
                                <svg id="eye-icon-show" class="w-5 h-5 block" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                                <svg id="eye-icon-hide" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. Education & Professional -->
            <div class="mb-8">
                <h3 class="text-xl font-bold text-gray-800 border-b pb-2 mb-4 flex items-center">
                    <span
                        class="bg-blue-100 text-blue-600 rounded-full w-8 h-8 flex items-center justify-center mr-2 text-sm">2</span>
                    Professional Details
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-gray-700 text-sm font-semibold mb-2">Specialization</label>
                        <select name="specialization" id="specSelect" required
                            class="w-full px-4 py-2 border rounded-lg bg-white" onchange="toggleOtherSpec(this)">
                            <option value="">Select</option>
                            <option>General Physician</option>
                            <option>Cardiologist</option>
                            <option>Dermatologist</option>
                            <option>Pediatrician</option>
                            <option>Dentist</option>
                            <option>Orthopedic</option>
                            <option value="Other">Other</option>
                        </select>
                        <input type="text" id="otherSpecInput" placeholder="Enter Specialization"
                            class="hidden mt-2 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-blue-50 border-blue-200">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-semibold mb-2">Experience (Years)</label>
                        <input type="number" name="experience" id="experience" readonly
                            class="w-full px-4 py-2 border rounded-lg bg-gray-100 text-gray-600 cursor-not-allowed"
                            placeholder="Auto-calculated">
                    </div>

                    <!-- Medical Registration Details -->
                    <div>
                        <label class="block text-gray-700 text-sm font-semibold mb-2">Medical Registration
                            Number</label>
                        <input type="text" name="registrationNumber" required
                            placeholder="e.g., TSMC12345 / MCI/2018/XXXX"
                            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-semibold mb-2">Medical Council</label>
                        <select name="medicalCouncil" required class="w-full px-4 py-2 border rounded-lg bg-white">
                            <option value="">Select Medical Council</option>
                            <option>Telangana Medical Council</option>
                            <option>Andhra Pradesh Medical Council</option>
                            <option>Karnataka Medical Council</option>
                            <option>Tamil Nadu Medical Council</option>
                            <option>Delhi Medical Council</option>
                            <option>Maharashtra Medical Council</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div class="md:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4 bg-gray-50 p-4 rounded-lg border">
                        <div class="md:col-span-2 font-semibold text-gray-600">Education</div>
                        <div>
                            <input type="text" name="educationDegree" placeholder="Degree (e.g. MBBS)" required
                                class="w-full px-4 py-2 border rounded-lg">
                        </div>
                        <div>
                            <input type="text" name="college" placeholder="College Name" required
                                class="w-full px-4 py-2 border rounded-lg">
                        </div>
                        <div>
                            <input type="number" name="passoutYear" id="passoutYear" placeholder="Year of Passing"
                                required class="w-full px-4 py-2 border rounded-lg"
                                oninput="calculateExperience(this.value)">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Medical License</label>
                            <input type="file" id="licenseImage" accept="image/*,application/pdf" class="text-sm w-full"
                                required onchange="previewImage(this, 'licensePreview')">
                            <div id="licensePreview" class="mt-2 text-xs text-green-600 hidden">File Selected</div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Government ID Proof</label>
                            <input type="file" id="govIdProof" accept="image/*,application/pdf" class="text-sm w-full"
                                onchange="previewImage(this, 'govIdPreview')">
                            <div id="govIdPreview" class="mt-2 text-xs text-green-600 hidden">File Selected</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3. Hospital & Location -->
            <div class="mb-8">
                <h3 class="text-xl font-bold text-gray-800 border-b pb-2 mb-4 flex items-center">
                    <span
                        class="bg-blue-100 text-blue-600 rounded-full w-8 h-8 flex items-center justify-center mr-2 text-sm">3</span>
                    Hospital / Clinic Details
                </h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="md:col-span-2">
                        <label class="block text-gray-700 text-sm font-semibold mb-2">Hospital / Clinic Name</label>
                        <input type="text" name="hospitalName" required
                            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-semibold mb-2">Hospital Phone</label>
                        <input type="tel" name="hospitalPhone" required class="w-full px-4 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-semibold mb-2">Consultation Fee (₹)</label>
                        <input type="number" name="fee" required class="w-full px-4 py-2 border rounded-lg">
                    </div>

                    <div>
                        <label class="block text-gray-700 text-sm font-semibold mb-2">Clinic Ownership Type</label>
                        <select name="practiceType" required class="w-full px-4 py-2 border rounded-lg bg-white">
                            <option value="">Select Ownership Type</option>
                            <option>Own Clinic</option>
                            <option>Visiting Consultant</option>
                            <option>Hospital Employee</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-gray-700 text-sm font-semibold mb-2">Consultation Mode</label>
                        <div class="flex space-x-4 mt-2">
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" name="consultationModes" value="IN_PERSON"
                                    class="w-4 h-4 text-blue-600">
                                <span>In-person</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" name="consultationModes" value="VIDEO"
                                    class="w-4 h-4 text-blue-600">
                                <span>Video Consultation</span>
                            </label>
                        </div>
                    </div>

                    <!-- Address Section -->
                    <div class="md:col-span-2 bg-blue-50 p-4 rounded-lg border border-blue-100">
                        <label class="block text-gray-700 text-sm font-bold mb-3">Clinic Location</label>

                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <input type="text" name="pincode" id="pincode" placeholder="Pincode"
                                class="w-full px-4 py-2 border rounded-lg" onblur="fetchPincodeDetails()">

                            <div id="city-wrapper" class="w-full">
                                <select name="city" id="city" class="w-full px-4 py-2 border rounded-lg bg-white"
                                    required>
                                    <option value="">Select Area/Village</option>
                                </select>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <input type="text" name="district" id="district" placeholder="District"
                                class="w-full px-4 py-2 border rounded-lg bg-gray-100" readonly>
                            <input type="text" name="state" id="state" placeholder="State"
                                class="w-full px-4 py-2 border rounded-lg bg-gray-100" readonly>
                        </div>

                        <div class="grid grid-cols-1 gap-4 mb-4">
                            <input type="text" name="street" placeholder="Street Address / Building"
                                class="w-full px-4 py-2 border rounded-lg">
                            <input type="text" name="landmark" placeholder="Landmark"
                                class="w-full px-4 py-2 border rounded-lg">
                        </div>

                        <button type="button" onclick="detectLocation()"
                            class="flex items-center justify-center w-full bg-indigo-100 text-indigo-700 py-2 rounded-lg hover:bg-indigo-200 transition">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z">
                                </path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            </svg>
                            Detect Exact Location
                        </button>
                        <p id="loc-status" class="text-xs text-center mt-2 text-gray-500"></p>
                        <input type="hidden" name="lat" id="lat">
                        <input type="hidden" name="lng" id="lng">
                    </div>
                </div>
            </div>

            <div class="pt-6">
                <button type="button" onclick="showPreview()"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg transition transform hover:scale-[1.01]">
                    Preview & Submit
                </button>
            </div>
        </form>
    </div>

    <!-- Preview Modal -->
    <div id="previewModal"
        class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b">
                <h2 class="text-2xl font-bold">Review Details</h2>
            </div>
            <div id="previewContent" class="p-6 space-y-4 text-sm text-gray-700">
                <!-- Content injected via JS -->
            </div>
            <div class="p-6 border-t bg-gray-50 flex space-x-4">
                <button onclick="closePreview()"
                    class="flex-1 px-4 py-2 border rounded-lg hover:bg-gray-100">Edit</button>
                <button onclick="submitForm()"
                    class="flex-1 px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 font-bold">Confirm
                    Registration</button>
            </div>
        </div>
    </div>

    <script>
        // State for Base64 Strings
        let doctorPhotoBase64 = null;
        let licenseImageBase64 = null;
        let govIdBase64 = null;

        // Toggle Other Spec
        function toggleOtherSpec(select) {
            const input = document.getElementById('otherSpecInput');
            if (select.value === 'Other') {
                input.classList.remove('hidden');
                input.setAttribute('required', 'true');
            } else {
                input.classList.add('hidden');
                input.removeAttribute('required');
                input.value = '';
            }
        }

        // Experience Calculation
        function calculateExperience(year) {
            const currentYear = new Date().getFullYear();
            const exp = currentYear - parseInt(year);
            const expInput = document.getElementById('experience');
            if (!isNaN(exp) && exp >= 0) {
                expInput.value = exp;
            } else {
                expInput.value = 0;
            }
        }

        // Image Handling
        function previewImage(input, previewId) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const reader = new FileReader();

                reader.onload = function (e) {
                    if (previewId === 'photoPreview') {
                        document.getElementById(previewId).innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover">`;
                        doctorPhotoBase64 = e.target.result;
                    } else if (previewId === 'govIdPreview') {
                        const previewEl = document.getElementById(previewId);
                        previewEl.classList.remove('hidden');
                        if (file.type === 'application/pdf') {
                            previewEl.textContent = "PDF ID Proof Selected";
                            previewEl.classList.add('text-blue-600');
                            previewEl.classList.remove('text-green-600');
                        } else {
                            previewEl.textContent = "ID Proof Image Selected";
                            previewEl.classList.add('text-green-600');
                            previewEl.classList.remove('text-blue-600');
                        }
                        govIdBase64 = e.target.result;
                    } else {
                        // Handle PDF or Image for License
                        const previewEl = document.getElementById(previewId);
                        previewEl.classList.remove('hidden');

                        if (file.type === 'application/pdf') {
                            previewEl.textContent = "PDF Document Selected: " + file.name;
                            previewEl.classList.add('text-blue-600');
                            previewEl.classList.remove('text-green-600');
                        } else {
                            previewEl.textContent = "Image Selected: " + file.name;
                            previewEl.classList.add('text-green-600');
                            previewEl.classList.remove('text-blue-600');
                        }
                        licenseImageBase64 = e.target.result;
                    }
                }
                reader.readAsDataURL(file);
            }
        }

        // Pincode API
        async function fetchPincodeDetails() {
            const pincode = document.getElementById('pincode').value;
            const cityWrapper = document.getElementById('city-wrapper');
            const districtInput = document.getElementById('district');
            const stateInput = document.getElementById('state');

            // Reset UI for loading
            cityWrapper.innerHTML = '<select name="city" id="city" class="w-full px-4 py-2 border rounded-lg bg-white" required><option value="">Loading...</option></select>';
            districtInput.readOnly = true;
            districtInput.classList.add('bg-gray-100');
            stateInput.readOnly = true;
            stateInput.classList.add('bg-gray-100');
            districtInput.value = '';
            stateInput.value = '';

            if (pincode.length === 6) {
                try {
                    const res = await fetch(`https://api.postalpincode.in/pincode/${pincode}`);
                    const data = await res.json();

                    if (data[0].Status === 'Success') {
                        const postOffices = data[0].PostOffice;
                        let optionsHtml = '<option value="">Select Area/Village</option>';

                        // Populate Dropdown
                        postOffices.forEach(po => {
                            optionsHtml += `<option value="${po.Name}">${po.Name}</option>`;
                        });

                        cityWrapper.innerHTML = `<select name="city" id="city" class="w-full px-4 py-2 border rounded-lg bg-white" required>${optionsHtml}</select>`;

                        // Auto-fill District & State from the first entry
                        if (postOffices.length > 0) {
                            districtInput.value = postOffices[0].District;
                            stateInput.value = postOffices[0].State;
                        }
                    } else {
                        throw new Error("Invalid Pincode");
                    }
                } catch (e) {
                    console.error('Pincode fetch error', e);
                    // Fallback to manual entry
                    cityWrapper.innerHTML = '<input type="text" name="city" id="city" class="w-full px-4 py-2 border rounded-lg" placeholder="Enter Area/Village" required>';
                    districtInput.readOnly = false;
                    districtInput.classList.remove('bg-gray-100');
                    stateInput.readOnly = false;
                    stateInput.classList.remove('bg-gray-100');
                }
            } else {
                cityWrapper.innerHTML = '<select name="city" id="city" class="w-full px-4 py-2 border rounded-lg bg-white" required><option value="">Select Area/Village</option></select>';
            }
        }

        // Geolocation
        function detectLocation() {
            const status = document.getElementById('loc-status');
            status.textContent = "Detecting...";
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        document.getElementById('lat').value = pos.coords.latitude;
                        document.getElementById('lng').value = pos.coords.longitude;
                        status.textContent = `Location Captured: ${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
                        status.className = "text-xs text-center mt-2 text-green-600 font-bold";
                    },
                    (err) => {
                        status.textContent = "Location access denied or unavailable.";
                        status.className = "text-xs text-center mt-2 text-red-600";
                    }
                );
            } else {
                status.textContent = "Geolocation not supported.";
            }
        }

        // Preview Logic
        function showPreview() {
            const form = document.getElementById('doctorForm');
            const data = new FormData(form);

            let html = '<div class="grid grid-cols-2 gap-y-2">';
            for (let [key, value] of data.entries()) {
                if (value instanceof File && value.name === "") continue; // Skip empty files
                if (key === 'password') continue; // Hide password
                html += `<div class="font-bold capitalize text-gray-600">${key.replace(/([A-Z])/g, ' $1')}:</div><div>${value}</div>`;
            }
            html += '</div>';

            if (doctorPhotoBase64) {
                html += `<div class="mt-4 border-t pt-2"><p class="font-bold mb-2">Photo:</p><img src="${doctorPhotoBase64}" class="h-20 w-20 rounded-full object-cover"></div>`;
            }
            if (licenseImageBase64) {
                const isPdf = licenseImageBase64.startsWith('data:application/pdf');
                html += `<div class="mt-4 border-t pt-2"><p class="font-bold mb-2">License:</p>`;
                if (isPdf) {
                    html += `<span class="text-blue-600 font-bold">PDF Document Attached</span>`;
                } else {
                    html += `<img src="${licenseImageBase64}" class="h-20 w-auto border">`;
                }
                html += `</div>`;
            }
            if (govIdBase64) {
                html += `<div class="mt-4 border-t pt-2"><p class="font-bold mb-2">ID Proof:</p><span class="text-green-600 font-bold">Attached</span></div>`;
            }
            // Show new fields in preview
            const modeMap = {
                'IN_PERSON': 'In-person',
                'VIDEO': 'Video Consultation'
            };
            const selectedModes = Array.from(data.getAll('consultationModes')).map(m => modeMap[m] || m);

            html += `<div class="mt-4 border-t pt-2">
                <p><strong>Consultation Modes:</strong> ${selectedModes.join(', ')}</p>
            </div>`;

            document.getElementById('previewContent').innerHTML = html;
            document.getElementById('previewModal').classList.remove('hidden');
        }

        function closePreview() {
            document.getElementById('previewModal').classList.add('hidden');
        }

        // Final Submit
        async function submitForm() {
            const form = document.getElementById('doctorForm');
            const formData = new FormData(form);
            const entries = Object.fromEntries(formData.entries());

            // Handle Specialization
            let finalSpecialization = entries.specialization;
            if (finalSpecialization === 'Other') {
                const otherInput = document.getElementById('otherSpecInput');
                if (otherInput.value.trim() !== "") {
                    finalSpecialization = otherInput.value.trim();
                } else {
                    alert("Please enter your specialization");
                    return;
                }
            }

            // Validation: At least one consultation mode
            const consultationModes = formData.getAll("consultationModes");
            if (consultationModes.length === 0) {
                alert("Please select at least one Consultation Mode");
                return;
            }

            if (!licenseImageBase64) {
                alert("Please upload Medical License");
                return;
            }

            if (!govIdBase64) {
                alert("Please upload Government ID Proof");
                return;
            }

            // Structure Data for Backend
            const payload = {
                name: entries.name,
                email: entries.email,
                phone: entries.personalPhone,
                password: entries.password,
                // Doctor Fields
                personalPhone: entries.personalPhone,
                hospitalPhone: entries.hospitalPhone,
                doctorPhoto: doctorPhotoBase64,
                specialization: finalSpecialization,
                experience: Number(entries.experience),

                // New Fields
                registrationNumber: entries.registrationNumber,
                medicalCouncil: entries.medicalCouncil,
                identityProof: govIdBase64,
                practiceType: entries.practiceType,
                consultationModes: consultationModes,

                education: entries.educationDegree,
                educationDetails: {
                    college: entries.college,
                    yearOfPassing: entries.passoutYear,
                    licenseImage: licenseImageBase64
                },
                consultationFee: Number(entries.fee),
                clinicAddress: {
                    name: entries.hospitalName,
                    street: entries.street,
                    landmark: entries.landmark,
                    city: entries.city,
                    district: entries.district,
                    state: entries.state,
                    pincode: entries.pincode,
                    coordinates: {
                        lat: Number(entries.lat || 0),
                        lng: Number(entries.lng || 0)
                    }
                },
                role: 'DOCTOR'
            };

            const btn = document.querySelector('#previewModal button.bg-green-600');
            const originalText = btn.textContent;

            try {
                btn.textContent = 'Registering...';
                btn.disabled = true;

                const response = await fetch('http://localhost:6002/api/auth/register-doctor', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (response.ok) {
                    closePreview();
                    document.getElementById('success-msg').classList.remove('hidden');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    form.reset();
                    // Reset Specialization
                    document.getElementById('otherSpecInput').classList.add('hidden');
                } else {
                    alert('Error: ' + (result.msg || 'Registration failed'));
                }
            } catch (e) {
                console.error('Registration Error:', e);
                alert('Connection Error: ' + e.message);
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        // Toggle Password Visibility
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const showIcon = document.getElementById('eye-icon-show');
            const hideIcon = document.getElementById('eye-icon-hide');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                showIcon.classList.add('hidden');
                showIcon.classList.remove('block');
                hideIcon.classList.add('block');
                hideIcon.classList.remove('hidden');
            } else {
                passwordInput.type = 'password';
                hideIcon.classList.add('hidden');
                hideIcon.classList.remove('block');
                showIcon.classList.add('block');
                showIcon.classList.remove('hidden');
            }
        }
    </script>
</body>

</html>
